[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-memory-pyramid"
version = "0.2.0"
description = "NapMem layered agent-memory pyramid with offline retrieval and optional shared Ollama integration."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic"]
ollama = [
    "ollama-client @ git+https://github.com/mithudso/ollama-client@740aca7cbc5aab4941779f35f1ca17b59fe73c7f",
]

[project.scripts]
napmem = "napmem_cli:main"

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = [
    "napmem_model",
    "napmem_search",
    "napmem_controls",
    "napmem_evidence",
    "napmem_eval",
    "napmem_storage",
    "napmem_jobs",
    "napmem_sources",
    "napmem_snapshots",
    "napmem_config",
    "napmem_cli",
    "napmem_inspector",
    "semantic_index",
    "ollama_extractor",
    "llm_extractor",
    "llm_extraction_prompts",
    "memory_pyramid_distiller",
    "naptime_consolidator",
    "napmem_retrieval_agent",
    "napmem_mcp_server",
    "napmem_mcp_failover",
]

[tool.setuptools.data-files]
"share/napmem/evaluations" = ["evaluations/memory_quality_v1.json"]
