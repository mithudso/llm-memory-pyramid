[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-memory-pyramid"
version = "0.2.0"
description = "NapMem layered agent-memory pyramid; Ollama embeddings and extraction via the shared ollama-client library."
requires-python = ">=3.11"
dependencies = [
    "ollama-client @ git+https://github.com/mithudso/ollama-client@740aca7cbc5aab4941779f35f1ca17b59fe73c7f",
]

[project.optional-dependencies]
llm = ["anthropic"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = [
    "napmem_model",
    "napmem_eval",
    "semantic_index",
    "ollama_extractor",
    "llm_extractor",
    "llm_extraction_prompts",
    "memory_pyramid_distiller",
    "naptime_consolidator",
    "napmem_retrieval_agent",
    "napmem_mcp_server",
    "napmem_mcp_failover",
]
