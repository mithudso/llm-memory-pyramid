name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ollama-client (private library; needs a read token secret)
        run: pip install "ollama-client @ git+https://x-access-token:${LIB_TOKEN}@github.com/mithudso/ollama-client"
        env:
          LIB_TOKEN: ${{ secrets.LIBS_READ_TOKEN }}
      - name: Compile check
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -v -s . -p "test_*.py"
        env:
          NAPMEM_EMBED_BACKEND: hashed

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff (advisory syntax/style check)
        run: |
          pip install ruff
          ruff check . --output-format=github
